name: build-windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译
        run: dotnet build src/PhoneMic/PhoneMic.csproj -c Release --nologo

      - name: 打包
        shell: pwsh
        run: |
          $bin = "src/PhoneMic/bin/Release/net48"
          $out = "out/phoneMic"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # 只带真正用到的文件：NAudio 的 Asio / Midi / WinForms 模块本程序不用，去掉省 120KB
          $keep = @(
            "PhoneMic.exe",
            "NAudio.dll", "NAudio.Core.dll", "NAudio.Wasapi.dll",
            "Microsoft.Win32.Registry.dll",
            "System.Security.AccessControl.dll", "System.Security.Principal.Windows.dll"
          )
          foreach ($f in $keep) { Copy-Item "$bin/$f" $out }

          # 把 VB-CABLE 官方安装包原样放进 driver 目录（离线可用）。
          # 许可允许「原样分发」（AS IS），所以这里不加任何修改；
          # 我们的程序只负责解压并打开它自己的安装界面。
          New-Item -ItemType Directory -Force -Path "$out/driver" | Out-Null
          $vbc = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip"
          Invoke-WebRequest -Uri $vbc -OutFile "$out/driver/VBCABLE_Driver_Pack43.zip" -UseBasicParsing
          @"
VB-CABLE 虚拟声卡驱动（VB-Audio 官方原版，未做任何修改）
来源：https://vb-audio.com/Cable/
VB-CABLE 是 donationware（自愿捐赠），欢迎支持作者。

用途：Windows 没有内置的「可写入式麦克风」，必须由虚拟声卡做中转。
本程序把声音写进 CABLE Input，其他软件把 CABLE Output 当麦克风即可。

安装：程序里点「安装虚拟声卡」，会打开官方 Setup，点 Install Driver 后重启一次。
卸载：托盘菜单 →「彻底卸载（含虚拟声卡）」。
"@ | Out-File -FilePath "$out/driver/说明.txt" -Encoding utf8

          Compress-Archive -Path "$out/*" -DestinationPath "phoneMic-windows.zip" -Force
          Get-ChildItem $out -Recurse -File | Select-Object FullName, Length
          Write-Host "压缩包大小: $([math]::Round((Get-Item phoneMic-windows.zip).Length/1KB,0)) KB"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: phoneMic-windows
          path: phoneMic-windows.zip
          retention-days: 30
