name: build-windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译
        run: dotnet build src/PhoneMic/PhoneMic.csproj -c Release --nologo

      - name: 打包
        shell: pwsh
        run: |
          $bin = "src/PhoneMic/bin/Release/net48"
          $out = "out/phoneMic"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # 只带真正用到的文件：NAudio 的 Asio / Midi / WinForms 模块本程序不用，去掉省 120KB
          $keep = @(
            "PhoneMic.exe",
            "NAudio.dll", "NAudio.Core.dll", "NAudio.Wasapi.dll",
            "Microsoft.Win32.Registry.dll",
            "System.Security.AccessControl.dll", "System.Security.Principal.Windows.dll"
          )
          foreach ($f in $keep) { Copy-Item "$bin/$f" $out }

          # 把 VB-CABLE 官方安装包原样放进 driver 目录（离线可用）。
          # 许可允许「原样分发」（AS IS），所以这里不加任何修改；
          # 我们的程序只负责解压并打开它自己的安装界面。
          $driver = Join-Path $out "driver"
          New-Item -ItemType Directory -Force -Path $driver | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip" `
            -OutFile (Join-Path $driver "VBCABLE_Driver_Pack43.zip")

          # 许可要求分发时注明来源与 donationware 性质
          $note = @(
            "VB-CABLE virtual audio driver (VB-Audio official package, unmodified)",
            "Source: https://vb-audio.com/Cable/",
            "VB-CABLE is donationware - please consider supporting the author.",
            "",
            "Why it is needed: Windows has no built-in writable microphone.",
            "phoneMic writes audio into CABLE Input; other apps use CABLE Output as a mic.",
            "",
            "Install: click 'Install virtual audio card' in phoneMic, then Install Driver, then reboot.",
            "Remove : tray menu -> 'Uninstall everything (including virtual cable)'."
          )
          $note | Out-File -FilePath (Join-Path $driver "README.txt") -Encoding utf8

          Compress-Archive -Path "$out/*" -DestinationPath "phoneMic-windows.zip" -Force
          Get-ChildItem $out -Recurse -File | Select-Object FullName, Length
          Write-Host "绿色包大小: $([math]::Round((Get-Item phoneMic-windows.zip).Length/1KB,0)) KB"

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 生成安装包（单文件 exe）
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\phoneMic.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }
          Get-ChildItem dist | Select-Object Name, Length
          Write-Host "安装包大小: $([math]::Round((Get-Item dist/phoneMic-setup.exe).Length/1MB,2)) MB"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: phoneMic-setup
          path: dist/phoneMic-setup.exe
          retention-days: 30

      - name: 上传绿色包
        uses: actions/upload-artifact@v4
        with:
          name: phoneMic-windows
          path: phoneMic-windows.zip
          retention-days: 30
